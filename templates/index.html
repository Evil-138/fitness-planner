<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPlan - Personalized Workout Planner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #4cc9f0;
            --light-color: #f8f9fa;
            --dark-color: #212529;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 80px 0;
        }
        
        .workout-form {
            max-width: 650px;
            margin: 0 auto;
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        
        .workout-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
        }
        
        .logo {
            text-align: center;
            margin-bottom: 15px;
        }
        
        .logo i {
            font-size: 2.5rem;
            color: var(--primary-color);
            background: rgba(67, 97, 238, 0.1);
            width: 70px;
            height: 70px;
            line-height: 70px;
            border-radius: 50%;
        }
        
        .form-heading {
            text-align: center;
            margin-bottom: 10px;
            color: var(--dark-color);
            font-weight: 700;
        }
        
        .form-subheading {
            text-align: center;
            margin-bottom: 30px;
            color: #6c757d;
            font-size: 1.1rem;
        }
        
        .form-label {
            font-weight: 500;
            color: var(--dark-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        
        .form-label i {
            margin-right: 10px;
            color: var(--primary-color);
        }
        
        .form-select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(67, 97, 238, 0.25);
        }
        
        .option-card {
            display: none;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(67, 97, 238, 0.4);
        }
        
        .form-footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 40px 20px;
            }
            
            .workout-form {
                padding: 30px 20px;
            }
        }
        
        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .workout-form {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="workout-form">
            <div class="logo">
                <i class="fas fa-dumbbell"></i>
            </div>
            <h1 class="form-heading">FitPlan</h1>
            <p class="form-subheading">Create your personalized workout plan in seconds</p>
            
            <form action="/generate" method="POST">
                <div class="mb-3">
                    <label for="goal" class="form-label">
                        <i class="fas fa-bullseye"></i> What's your fitness goal?
                    </label>
                    <select class="form-select" id="goal" name="goal" required>
                        <option value="" disabled selected>Select your goal</option>
                        <option value="build_muscle">Build Muscle 💪</option>
                        <option value="lose_fat">Lose Fat 🔥</option>
                        <option value="general_fitness">General Fitness ⚡</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="level" class="form-label">
                        <i class="fas fa-chart-line"></i> What's your experience level?
                    </label>
                    <select class="form-select" id="level" name="level" required>
                        <option value="" disabled selected>Select your level</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="days" class="form-label">
                        <i class="fas fa-calendar-alt"></i> How many days per week can you workout?
                    </label>
                    <select class="form-select" id="days" name="days" required>
                        <option value="" disabled selected>Select days per week</option>
                        <option value="3">3 days</option>
                        <option value="4">4 days</option>
                        <option value="5">5 days</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">
                    <i class="fas fa-bolt"></i> Generate My Plan
                </button>
            </form>
            
            <div class="form-footer">
                <p>Get ready to transform your fitness journey with a customized plan!</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript for enhanced interactivity -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Enhance form select elements with animation
            const selects = document.querySelectorAll('.form-select');
            
            selects.forEach(select => {
                select.addEventListener('change', function() {
                    if (this.value) {
                        this.style.borderColor = '#4361ee';
                        this.style.boxShadow = '0 0 0 0.25rem rgba(67, 97, 238, 0.25)';
                        
                        // Add a subtle animation when option is selected
                        this.animate([
                            { transform: 'scale(1.02)' },
                            { transform: 'scale(1)' }
                        ], {
                            duration: 300,
                            easing: 'ease-out'
                        });
                    }
                });
            });
            
            // Add form submission animation
            const form = document.querySelector('form');
            const submitBtn = document.querySelector('.btn-submit');
            
            form.addEventListener('submit', function(e) {
                // Add loading state to button
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating your plan...';
                submitBtn.disabled = true;
            });
            
            // Validate form to enable button when all fields are filled
            function validateForm() {
                const goal = document.getElementById('goal').value;
                const level = document.getElementById('level').value;
                const days = document.getElementById('days').value;
                
                if (goal && level && days) {
                    submitBtn.classList.add('pulse-animation');
                } else {
                    submitBtn.classList.remove('pulse-animation');
                }
            }
            
            selects.forEach(select => select.addEventListener('change', validateForm));
            
            // Add hover effects for better interactivity
            submitBtn.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px)';
            });
            
            submitBtn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
